agent:
  proxy_url: "http://localhost:8080"
  log_level: "INFO"   # 默认是 INFO ，设为 DEBUG 可查看原始诊断数据
  model:
    provider: "deepseek"
    api_key_env: "OPENAI_API_KEY"     # 从环境变量读取
    base_url: "https://api.deepseek.com"
    model_name: "deepseek-chat"
    temperature: 0.1
    max_tokens: 4096
    timeout: 120
    context_length_limit: 16000  # 注入 LLM 的报告最大字符数
    prompt_template: |
      你是一个资深的 C++ 性能专家，下面是一份或多份诊断工具的输出报告。
      请综合分析并回答以下问题：
      1. 程序是否存在内存泄漏？依据是什么？
      2. 如果存在，泄漏规模有多大？（估算字节数）
      3. 最可能的泄漏原因是什么？（给出调用栈或代码位置）
      4. 提供具体的修复建议。

      诊断报告：
      {report_text}
  target:
    program: "./test_app/build/Debug/test_app"              # 可通过命令行覆盖
  tools:
    enabled: ["heaptrack", "perf"]
  report:
    format: "markdown"
    include_raw: true   # 在报告中附带原始诊断数据
    output_dir: "./reports"
